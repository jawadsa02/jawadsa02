<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jawad Saied Ahmed — Electrical Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#4493f8"/>
    </linearGradient>
    <style>
      .trace { stroke:#1f2a3a; stroke-width:2; fill:none; }
      .lit   { stroke:url(#accent); stroke-width:2; fill:none; stroke-dasharray:6 14;
               animation: flow 3.2s linear infinite; opacity:.85; }
      .via   { fill:#1f2a3a; }
      .pulse { fill:#39d353; animation: blink 2.4s ease-in-out infinite; }
      .pulse.b { fill:#4493f8; animation-delay:1.2s; }
      .name  { font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif; fill:#e6edf3; letter-spacing:.5px; }
      .role  { font:400 22px 'Cascadia Code','SF Mono',Consolas,monospace; fill:#39d353; }
      .sub   { font:400 16px 'Segoe UI',Helvetica,Arial,sans-serif; fill:#8d96a0; }
      .chip  { fill:none; stroke:#2c3a4f; stroke-width:2; }
      .pin   { stroke:#2c3a4f; stroke-width:2; }
      @keyframes flow  { to { stroke-dashoffset:-100; } }
      @keyframes blink { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- circuit traces, left field -->
  <path class="trace" d="M-10 60 H120 L160 100 H250 L290 60 H370"/>
  <path class="lit"   d="M-10 60 H120 L160 100 H250 L290 60 H370"/>
  <path class="trace" d="M-10 140 H90 L130 180 H300"/>
  <path class="trace" d="M-10 250 H140 L180 210 H330 L360 240 H420"/>
  <path class="lit"   d="M-10 250 H140 L180 210 H330 L360 240 H420" style="animation-delay:1.1s"/>
  <path class="trace" d="M60 320 V270 L100 230 H190"/>
  <circle class="via" cx="370" cy="60" r="5"/><circle class="pulse" cx="370" cy="60" r="3"/>
  <circle class="via" cx="300" cy="180" r="5"/><circle class="pulse b" cx="300" cy="180" r="3"/>
  <circle class="via" cx="420" cy="240" r="5"/><circle class="pulse" cx="420" cy="240" r="3" style="animation-delay:.6s"/>
  <circle class="via" cx="190" cy="230" r="5"/>

  <!-- circuit traces, right field -->
  <path class="trace" d="M1290 80 H1150 L1110 120 H1000 L960 80 H880"/>
  <path class="lit"   d="M1290 80 H1150 L1110 120 H1000 L960 80 H880" style="animation-delay:.5s"/>
  <path class="trace" d="M1290 190 H1180 L1140 230 H1030"/>
  <path class="trace" d="M1290 280 H1120 L1080 240 H990"/>
  <circle class="via" cx="880" cy="80" r="5"/><circle class="pulse b" cx="880" cy="80" r="3" style="animation-delay:.3s"/>
  <circle class="via" cx="1030" cy="230" r="5"/><circle class="pulse" cx="1030" cy="230" r="3" style="animation-delay:1.7s"/>
  <circle class="via" cx="990" cy="240" r="5"/>

  <!-- small IC footprint, bottom right -->
  <g transform="translate(1095,30)">
    <rect class="chip" x="0" y="0" width="80" height="56" rx="6"/>
    <line class="pin" x1="-14" y1="12" x2="0" y2="12"/><line class="pin" x1="-14" y1="28" x2="0" y2="28"/><line class="pin" x1="-14" y1="44" x2="0" y2="44"/>
    <line class="pin" x1="80" y1="12" x2="94" y2="12"/><line class="pin" x1="80" y1="28" x2="94" y2="28"/><line class="pin" x1="80" y1="44" x2="94" y2="44"/>
    <circle class="pulse" cx="14" cy="14" r="3"/>
  </g>

  <!-- text -->
  <text class="name" x="640" y="148" text-anchor="middle">Jawad Saied Ahmed</text>
  <text class="role" x="640" y="190" text-anchor="middle">RTL · VLSI · FPGA · Analog</text>
  <text class="sub"  x="640" y="226" text-anchor="middle">From transistor sizing to processor bring-up</text>
  <text class="sub"  x="640" y="254" text-anchor="middle">Tel Aviv University · B.Sc. Electrical Engineering</text>
</svg>
